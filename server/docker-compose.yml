services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/capsule-sms.sqlite
      PUBLIC_BASE_URL: https://${SYNC_DOMAIN:?set SYNC_DOMAIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      TRUST_PROXY: 1
      MESSAGE_TTL_HOURS: ${MESSAGE_TTL_HOURS:-168}
    volumes:
      - capsule_data:/app/data
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  capsule_data:
  caddy_data:
  caddy_config:
